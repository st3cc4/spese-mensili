<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spese Mensili PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Stili specifici per la barra di navigazione inferiore ingrandita */
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px !important; /* Ingrandita */
            background: white;
            display: flex;
            border-top: 1px solid #ddd;
            box-shadow: -2px 5px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #666;
            font-size: 13px !important; /* Testo più grande */
            font-weight: 600;
        }
        .nav-item span {
            font-size: 24px !important; /* Icone più grandi */
            margin-bottom: 2px;
        }
        body {
            padding-bottom: 90px !important; /* Spazio per evitare che il contenuto finisca sotto la barra */
        }
    </style>
</head>
<body>

    <!-- Schermata di Accesso -->
    <div id="auth-screen" class="auth-container hidden">
        <h2>Accesso Spese Mensili</h2>
        <form id="login-form">
            <div class="form-group">
                <label>Email (ID User)</label>
                <input type="email" id="email" required placeholder="inserisci email">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" required placeholder="inserisci password">
            </div>
            <button type="submit" class="btn">Accedi / Registrati</button>
        </form>
    </div>

    <!-- Applicazione Principale (Dashboard) -->
    <div id="app-screen" class="hidden">
        <header>
            <h1>Dashboard Spese</h1>
            <button id="logout-btn" class="btn btn-secondary" style="width: auto; padding: 4px 10px; font-size: 12px;">Esci</button>
        </header>

        <div class="container">
            <!-- Box Stipendio allineato nello stile con i campi spesa -->
            <div class="card">
                <div class="form-group form-group-horizontal" style="margin-bottom: 0;">
                    <label style="flex: 0 0 130px; font-size: 12px; color: #3b5998; font-weight: bold;">Prossimo Stipendio</label>
                    <input type="date" id="salary-date" style="flex: 1;">
                    <button type="button" id="open-salary-modal" class="btn-orange-add" style="width: 42px; height: 42px; font-size: 18px;" title="Modifica Stipendio ed Extra">⚙️</button>
                </div>
            </div>

            <!-- Dashboard Calcoli -->
            <div class="card">
                <h3>Riepilogo Budget</h3>
                <div class="metric-grid">
                    <div class="metric-box metric-horizontal">
                        <span>Giorni Mancanti</span>
                        <strong id="days-left">0</strong>
                    </div>
                    <div class="metric-box metric-horizontal">
                        <span>Speso Oggi</span>
                        <strong id="spent-today">€ 0.00</strong>
                    </div>
                </div>
                <div class="metric-grid">
                    <div class="metric-box metric-horizontal">
                        <span>Residuo</span>
                        <strong id="salary-residue">€ 0.00</strong>
                    </div>
                    <div class="metric-box metric-horizontal">
                        <span>€ al giorno</span>
                        <strong id="daily-budget">€ 0.00</strong>
                    </div>
                </div>
            </div>

            <!-- Modulo Inserimento / Modifica Spesa -->
            <div class="card card-highlight">
                <h3 id="form-expense-title">Aggiungi Nuova Spesa</h3>
                <form id="expense-form">
                    <input type="hidden" id="edit-expense-id">
                    
                    <div class="form-group form-group-horizontal">
                        <label>Importo (€)</label>
                        <input type="number" step="0.01" id="expense-amount" required placeholder="0.00">
                    </div>

                    <div class="form-group form-group-horizontal">
                        <label>Data</label>
                        <input type="date" id="expense-date" required>
                    </div>

                    <div class="form-group form-group-horizontal">
                        <label>Categoria</label>
                        <div class="category-select-wrapper">
                            <select id="expense-category" required style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background-color: #fff;">
                                <option value="" disabled selected>Seleziona categoria...</option>
                            </select>
                            <button type="button" id="quick-add-category-btn" class="btn-orange-add" title="Aggiungi Categoria">+</button>
                        </div>
                    </div>

                    <button type="submit" id="save-expense-btn" class="btn" style="margin-top: 5px;">Salva Spesa</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary hidden" style="margin-top: 6px;">Annulla Modifica</button>
                </form>
            </div>

            <!-- Spese di Oggi -->
            <div class="card">
                <h3>Spese di Oggi</h3>
                <div id="recent-expenses-list"></div>
            </div>

            <!-- Firma d'autore in basso a destra -->
            <div class="watermark-signature">Created by STECCA</div>
        </div>

        <!-- Pop-up (Modale) per Impostazioni Stipendio ed Extra -->
        <div id="salary-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <h3>Modifica Stipendio ed Extra</h3>
                <div class="form-group">
                    <label>Importo Stipendio (€)</label>
                    <input type="number" step="0.01" id="modal-salary-base" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Extra / Spese (+ / -)</label>
                    <input type="text" id="modal-salary-extra" placeholder="es. 139.20 + 90">
                </div>
                <div style="display: flex; gap: 8px; margin-top: 15px;">
                    <button type="button" id="save-salary-modal-btn" class="btn">Salva</button>
                    <button type="button" id="close-salary-modal" class="btn btn-secondary">Annulla</button>
                </div>
            </div>
        </div>

        <!-- Menu Navigazione Inferiore Ingrandito -->
        <nav class="nav-bar">
            <a href="index.html" class="nav-item active">
                <span>🏠</span> Dashboard
            </a>
            <a href="storico.html" class="nav-item">
                <span>📊</span> Storico
            </a>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
