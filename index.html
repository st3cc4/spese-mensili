<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spese Mensili PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <style>
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px !important;
            background: white;
            display: flex;
            border-top: 1px solid #ddd;
            box-shadow: -2px 5px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #666;
            font-size: 13px !important;
            font-weight: 600;
        }
        .nav-item span {
            font-size: 24px !important;
            margin-bottom: 2px;
        }
        body {
            padding-bottom: 90px !important;
        }

        .card h3, .form-group label, .form-group-horizontal label {
            font-size: 14px !important;
            color: #3b5998 !important;
            font-weight: bold !important;
        }

        .metric-box span {
            font-size: 11px !important;
            font-weight: 600 !important;
            color: #495057 !important;
            text-transform: capitalize !important;
        }
        .metric-box strong {
            font-size: 16px !important;
            color: #212529 !important;
        }

        .modal-content .form-group label {
            display: block;
            font-size: 14px !important;
            color: #3b5998 !important;
            font-weight: bold !important;
            margin-bottom: 6px;
        }
        .modal-content .form-group input {
            width: 100% !important;
            box-sizing: border-box !important;
            padding: 10px !important;
            font-size: 14px !important;
            border: 1px solid #ccc !important;
            border-radius: 6px !important;
            background-color: #fff !important;
        }

        #category-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .category-suggestion-item {
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f1f3f5;
        }
        .category-suggestion-item:hover {
            background-color: #f8f9fa;
            color: #3b5998;
            font-weight: 600;
        }

        /* Stile pulsante Elimina Categoria (la X rossa/rossa scura) */
        .btn-danger-action {
            background-color: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .btn-danger-action:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>

    <!-- Schermata di Accesso -->
    <div id="auth-screen" class="hidden" style="max-width: 420px; margin: 60px auto; padding: 0 15px;">
        <div class="card" style="padding: 25px;">
            <h3 style="font-size: 18px; color: #3b5998; margin-bottom: 18px; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 10px; font-weight: bold;">Accesso</h3>
            <form id="login-form">
                <div class="form-group" style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #3b5998; margin-bottom: 6px;">Email (ID User)</label>
                    <input type="email" id="email" required placeholder="inserisci email" style="width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background-color: #fff;">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; font-size: 13px; font-weight: 600; color: #3b5998; margin-bottom: 6px;">Password</label>
                    <input type="password" id="password" required placeholder="inserisci password" style="width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; background-color: #fff;">
                </div>
                <button type="submit" class="btn" style="width: 100%; padding: 12px; background-color: #3b5998; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer;">Accedi / Registrati</button>
            </form>
        </div>
    </div>

    <!-- Applicazione Principale (Dashboard) -->
    <div id="app-screen" class="hidden">
        <header>
            <h1>Dashboard</h1>
            <button id="logout-btn" class="btn btn-secondary" style="width: auto; padding: 4px 10px; font-size: 12px;">Esci</button>
        </header>

        <div class="container">
            <!-- Box Data Stipendio uniformato -->
            <div class="card">
                <div class="form-group form-group-horizontal" style="margin-bottom: 0; align-items: center;">
                    <label style="flex: 0 0 110px; margin-bottom: 0;">Data Stipendio</label>
                    <input type="date" id="salary-date" style="flex: 1; height: 42px; padding: 8px 10px; box-sizing: border-box;">
                    <button type="button" id="open-salary-modal" class="btn-orange-add" style="width: 42px; height: 42px; font-size: 18px; display: flex; align-items: center; justify-content: center;" title="Modifica Stipendio ed Extra">⚙️</button>
                </div>
            </div>

            <!-- Dashboard Calcoli -->
            <div class="card">
                <h3>Riepilogo Budget</h3>
                <div class="metric-grid">
                    <div class="metric-box metric-horizontal">
                        <span>Giorni mancanti</span>
                        <strong id="days-left">0</strong>
                    </div>
                    <div class="metric-box metric-horizontal">
                        <span>Speso oggi</span>
                        <strong id="spent-today">€ 0.00</strong>
                    </div>
                </div>
                <div class="metric-grid">
                    <div class="metric-box metric-horizontal">
                        <span>Residuo</span>
                        <strong id="salary-residue">€ 0.00</strong>
                    </div>
                    <div class="metric-box metric-horizontal">
                        <span>Al giorno</span>
                        <strong id="daily-budget">€ 0.00</strong>
                    </div>
                </div>
            </div>

            <!-- Modulo Inserimento / Modifica Spesa con Categoria Filtrabile e Pulsante X -->
            <div class="card card-highlight">
                <h3 id="form-expense-title">Aggiungi Nuova Spesa</h3>
                <form id="expense-form">
                    <input type="hidden" id="edit-expense-id">
                    
                    <div class="form-group form-group-horizontal">
                        <label>Importo (€)</label>
                        <input type="number" step="0.01" id="expense-amount" required placeholder="0.00">
                    </div>

                    <div class="form-group form-group-horizontal">
                        <label>Data</label>
                        <input type="date" id="expense-date" required>
                    </div>

                    <div class="form-group form-group-horizontal">
                        <label>Categoria</label>
                        <div class="category-select-wrapper" style="display: flex; gap: 8px; width: 100%; position: relative;">
                            <div style="flex: 1; position: relative;">
                                <input type="text" id="expense-category" autocomplete="off" required placeholder="Scrivi o seleziona..." style="width: 100%; padding: 10px; font-size: 14px; border: 1px solid #ccc; border-radius: 6px; background-color: #fff; box-sizing: border-box;">
                                <div id="category-dropdown" class="hidden"></div>
                            </div>
                            <button type="button" id="delete-category-btn" class="btn-danger-action" title="Elimina categoria selezionata" style="width: 42px; height: 42px; font-size: 18px; flex-shrink: 0;">✕</button>
                        </div>
                    </div>

                    <button type="submit" id="save-expense-btn" class="btn" style="margin-top: 5px;">Salva Spesa</button>
                    <button type="button" id="cancel-edit-btn" class="btn btn-secondary hidden" style="margin-top: 6px;">Annulla Modifica</button>
                </form>
            </div>

            <!-- Spese di Oggi -->
            <div class="card">
                <h3>Spese di oggi</h3>
                <div id="recent-expenses-list"></div>
            </div>

            <!-- Firma d'autore in basso a destra -->
            <div class="watermark-signature">Created by STECCA</div>
        </div>

        <!-- Pop-up (Modale) per Impostazioni Stipendio ed Extra -->
        <div id="salary-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <h3>Modifica Stipendio ed Extra</h3>
                <div class="form-group">
                    <label>Importo Stipendio (€)</label>
                    <input type="number" step="0.01" id="modal-salary-base" placeholder="0.00">
                </div>
                <div class="form-group">
                    <label>Extra / Spese (+ / -)</label>
                    <input type="text" id="modal-salary-extra" placeholder="es. 139.20 + 90">
                </div>
                <div style="display: flex; gap: 8px; margin-top: 15px;">
                    <button type="button" id="save-salary-modal-btn" class="btn">Salva</button>
                    <button type="button" id="close-salary-modal" class="btn btn-secondary">Annulla</button>
                </div>
            </div>
        </div>

        <!-- Menu Navigazione Inferiore Ingrandito -->
        <nav class="nav-bar">
            <a href="index.html" class="nav-item active">
                <span>🏠</span> Dashboard
            </a>
            <a href="storico.html" class="nav-item">
                <span>📊</span> Storico
            </a>
        </nav>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
