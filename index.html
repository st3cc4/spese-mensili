<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Spese Mensili</title>
    <link rel="stylesheet" href="stile.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b5998">
</head>
<body>

    <!-- Schermata Autenticazione -->
    <div id="auth-screen" class="auth-container hidden">
        <div class="card">
            <h2>Accedi o Registrati</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="esempio@email.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="Almeno 6 caratteri">
                </div>
                <button type="submit" class="btn-primary">Entra</button>
            </form>
        </div>
        <div style="text-align: right; font-weight: bold; font-style: italic; color: #0000ff; font-size: 15px; margin-top: 15px; margin-bottom: 10px;">Stecca</div>
    </div>

    <!-- Applicazione Principale -->
    <div id="app-screen" class="hidden">

        <!-- Vista Dashboard -->
        <div id="view-dashboard" class="container">
            <header class="app-header">
                <h1>Dashboard</h1>
                <button id="logout-btn" class="btn-logout">Esci</button>
            </header>

            <!-- Data Stipendio & Impostazioni -->
            <div class="card">
                <div class="salary-header-row">
                    <label for="salary-date" class="salary-label">Data Stipendio</label>
                    <div class="salary-controls">
                        <input type="date" id="salary-date" class="bold-input">
                        <button type="button" id="open-salary-modal" class="btn-icon-gear" title="Imposta Stipendio ed Extra">⚙️</button>
                    </div>
                </div>
            </div>

            <!-- Riepilogo Budget -->
            <div class="card">
                <h3>Riepilogo Budget</h3>
                <div class="metric-grid">
                    <div class="metric-box">
                        <span class="metric-label">Giorni Mancanti</span>
                        <strong id="days-left" class="metric-value">0</strong>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Speso Oggi</span>
                        <strong id="spent-today" class="metric-value">€ 0.00</strong>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Residuo</span>
                        <strong id="salary-residue" class="metric-value">€ 0.00</strong>
                    </div>
                    <div class="metric-box">
                        <span class="metric-label">Al Giorno</span>
                        <strong id="daily-budget" class="metric-value">€ 0.00</strong>
                    </div>
                </div>
            </div>

            <!-- Aggiungi Nuova Spesa -->
            <div class="card">
                <div class="card-title-row">
                    <h3 id="form-expense-title" style="margin: 0;">Aggiungi Nuova Spesa</h3>
                    <button type="button" id="voice-expense-btn" class="btn-voice" title="Detta importo e categoria">🎤 Voce</button>
                </div>
                <div id="voice-status" class="voice-status hidden"></div>

                <form id="expense-form">
                    <input type="hidden" id="edit-expense-id">
                    <div class="form-row-2">
                        <div class="form-group">
                            <label for="expense-amount">Importo (€)</label>
                            <input type="text" id="expense-amount" inputmode="decimal" required placeholder="0.00">
                        </div>
                        <div class="form-group">
                            <label for="expense-date">Data</label>
                            <input type="date" id="expense-date" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="expense-category">Categoria</label>
                        <div class="category-row">
                            <div style="flex: 1; position: relative;">
                                <input type="text" id="expense-category" autocomplete="off" required placeholder="Scrivi o seleziona...">
                                <div id="category-dropdown" class="hidden"></div>
                            </div>
                            <button type="button" id="delete-category-btn" class="btn-delete-cat" title="Elimina categoria">✕</button>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Salva Spesa</button>
                    <button type="button" id="cancel-edit-btn" class="btn-secondary hidden">Annulla Modifica</button>
                </form>
            </div>

            <!-- Spese di oggi -->
            <div class="card">
                <h3>Spese di oggi</h3>
                <div id="recent-expenses-list"></div>
            </div>

            <!-- Firma personalizzata -->
            <div style="text-align: right; font-weight: bold; font-style: italic; color: #0000ff; font-size: 15px; margin-top: 15px; margin-bottom: 10px;">Stecca</div>
        </div>

        <!-- Vista Storico -->
        <div id="view-storico" class="hidden" style="height: calc(100vh - 64px);">
            <iframe id="storico-frame" src="storico/storico.html" style="width: 100%; height: 100%; border: none;"></iframe>
        </div>

        <!-- Barra Navigazione Inferiore -->
        <nav class="bottom-nav">
            <button type="button" id="nav-btn-dashboard" class="nav-btn active">
                <span class="nav-icon">🏠</span>
                <span>Dashboard</span>
            </button>
            <button type="button" id="nav-btn-storico" class="nav-btn">
                <span class="nav-icon">📊</span>
                <span>Storico</span>
            </button>
        </nav>
    </div>

    <!-- Modale Stipendio ed Extra -->
    <div id="salary-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h3>Imposta Stipendio ed Extra</h3>
            <div class="form-group">
                <label for="modal-salary-base">Stipendio Base (€)</label>
                <input type="text" id="modal-salary-base" inputmode="decimal" placeholder="Es. 1500">
            </div>
            <div class="form-group">
                <label for="modal-salary-extra">Extra (puoi scrivere una somma es. 100 + 50)</label>
                <input type="text" id="modal-salary-extra" placeholder="Es. 0">
            </div>
            <div class="modal-actions">
                <button type="button" id="save-salary-modal-btn" class="btn-success">Salva</button>
                <button type="button" id="close-salary-modal" class="btn-secondary">Chiudi</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
