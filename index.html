<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spese Mensili PWA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Schermata di Login -->
    <div id="auth-screen" class="auth-container">
        <h2>Accesso Spese Mensili</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="email">Email (ID)</label>
                <input type="email" id="email" required placeholder="tuamail@example.com">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="La tua password">
            </div>
            <button type="submit" class="btn">Accedi / Registrati</button>
        </form>
    </div>

    <!-- Applicazione Principale -->
    <div id="app-screen" class="hidden">
        <header>
            <h1>Le Mie Spese</h1>
            <button id="logout-btn" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 14px;">Esci</button>
        </header>

        <div class="container">
            <!-- Box Stipendio e Configurazione -->
            <div class="card">
                <h3>Configurazione Stipendio & Budget</h3>
                <div class="form-group">
                    <label>Data Prossimo Stipendio</label>
                    <input type="date" id="salary-date">
                </div>
                <div class="metric-grid">
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Importo Base (€)</label>
                        <input type="number" step="0.01" id="salary-base" placeholder="0.00">
                    </div>
                    <div class="form-group" style="margin-bottom:0;">
                        <label>Extra (+ / - €)</label>
                        <input type="number" step="0.01" id="salary-extra" placeholder="0.00">
                    </div>
                </div>
                <button id="save-salary-btn" class="btn" style="margin-top: 12px;">Salva Impostazioni Stipendio</button>
            </div>

            <!-- Box Metriche in Tempo Reale -->
            <div class="card">
                <h3>Panoramica Finanziaria</h3>
                <div class="metric-grid">
                    <div class="metric-box">
                        <span>Giorni Mancanti</span>
                        <strong id="days-left">0</strong>
                    </div>
                    <div class="metric-box">
                        <span>Speso Oggi</span>
                        <strong id="spent-today">€ 0.00</strong>
                    </div>
                </div>
                <div class="metric-grid">
                    <div class="metric-box">
                        <span>Residuo Stipendio</span>
                        <strong id="salary-residue">€ 0.00</strong>
                    </div>
                    <div class="metric-box">
                        <span>Budget Giornaliero</span>
                        <strong id="daily-budget">€ 0.00</strong>
                    </div>
                </div>
            </div>

            <!-- Inserimento Nuova Spesa -->
            <div class="card">
                <h3>Aggiungi Nuova Spesa</h3>
                <form id="expense-form">
                    <div class="form-group">
                        <label>Importo (€)</label>
                        <input type="number" step="0.01" id="expense-amount" required placeholder="0.00">
                    </div>
                    <div class="form-group">
                        <label>Data</label>
                        <input type="date" id="expense-date" required>
                    </div>
                    <div class="form-group">
                        <label>Categoria</label>
                        <select id="expense-category" required>
                            <option value="">Seleziona categoria...</option>
                        </select>
                    </div>
                    <button type="submit" class="btn">Registra Spesa</button>
                </form>
            </div>

            <!-- Gestione Categorie e Ultime Spese -->
            <div class="card">
                <h3>Gestione Categorie</h3>
                <div class="form-group" style="display: flex; gap: 8px;">
                    <input type="text" id="new-category-name" placeholder="Nuova categoria..." style="margin-bottom:0;">
                    <button id="add-category-btn" class="btn" style="width: auto;">Aggiungi</button>
                </div>
                <div id="categories-list" style="margin-top: 12px;"></div>
            </div>

            <div class="card">
                <h3>Ultime Spese Registrate</h3>
                <div id="recent-expenses-list"></div>
            </div>
        </div>

        <!-- Barra di Navigazione Inferiore -->
        <nav class="nav-bar">
            <a href="index.html" class="nav-item active">
                <span>🏠</span> Dashboard
            </a>
            <a href="storico.html" class="nav-item">
                <span>📊</span> Storico & Filtri
            </a>
        </nav>
    </div>

    <!-- Script Principale -->
    <script type="module" src="app.js"></script>
</body>
</html>
