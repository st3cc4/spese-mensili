<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spese Mensili</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Spese Mensili</h1>

        <!-- Riepilogo -->
        <div class="card">
            <p><strong>Budget Iniziale:</strong> <span id="initial-budget">0.00</span> €</p>
            <p><strong>Spese Totali:</strong> <span id="total-spent">0.00</span> €</p>
            <p><strong>Residuo:</strong> <span id="remaining-budget">0.00</span> €</p>
            <p><strong>Giorni mancanti:</strong> <span id="days-remaining">0</span></p>
            <p><strong>Budget Giornaliero Consigliato:</strong> <span id="daily-budget">0.00</span> €</p>
            <button id="btn-edit-budget" class="btn-modifica">Modifica</button>
        </div>

        <!-- Inserimento Spesa -->
        <div class="card">
            <h2>Inserisci Spesa</h2>
            <form id="expense-form">
                <div class="form-group">
                    <label for="expense-amount">Importo (€):</label>
                    <input type="number" id="expense-amount" step="0.01" required>
                </div>
                <div class="form-group">
                    <label for="expense-category">Categoria:</label>
                    <select id="expense-category" required></select>
                </div>
                <div class="form-group">
                    <label for="expense-date">Data:</label>
                    <input type="date" id="expense-date" required>
                </div>
                <button type="submit" id="btn-save-expense" class="btn-salva">Salva spesa</button>
            </form>
        </div>

        <!-- Gestione Categorie -->
        <div class="card">
            <h2>Gestione Categorie</h2>
            <div class="form-group">
                <input type="text" id="new-category-name" placeholder="Nuova categoria">
            </div>
            <button id="btn-manage-cat" class="btn-gestisci">Gestisci categorie</button>
            <ul id="category-list"></ul>
        </div>

        <!-- Statistiche -->
        <div class="card">
            <h2>Statistiche</h2>
            <div class="form-group">
                <label for="stat-filter">Filtra per:</label>
                <select id="stat-filter">
                    <option value="day">Giorno</option>
                    <option value="week">Settimana</option>
                    <option value="month">Mese</option>
                    <option value="year">Anno</option>
                    <option value="range">Intervallo personalizzato</option>
                </select>
            </div>
            <div id="date-range-inputs" style="display: none;">
                <div class="form-group">
                    <label>Da:</label>
                    <input type="date" id="stat-start-date">
                </div>
                <div class="form-group">
                    <label>Da (fine):</label>
                    <input type="date" id="stat-end-date">
                </div>
            </div>
            <div id="stat-results">
                <p><strong>Totale filtrato:</strong> <span id="filtered-total">0.00</span> €</p>
                <div id="filtered-category-breakdown"></div>
            </div>
        </div>

        <!-- Storico Spese -->
        <div class="card">
            <h2>Storico Spese</h2>
            <ul id="expense-list"></ul>
        </div>
    </div>

    <footer>
        <p>Created by STECCA</p>
    </footer>

    <script type="module" src="script.js"></script>
</body>
</html>
