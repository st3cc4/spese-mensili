<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spese Mensili PWA</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3b5998">
    <!-- Flatpickr CSS per calendario -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

    <!-- Schermata di Autenticazione (Login / Registrazione) -->
    <div id="auth-screen" class="container">
        <div class="card" style="margin-top: 50px; text-align: center;">
            <h2>Accesso Spese Mensili</h2>
            <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Inserisci le tue credenziali per accedere al tuo budget</p>
            <form id="login-form">
                <div class="form-group" style="text-align: left;">
                    <label>Email</label>
                    <input type="email" id="email" required placeholder="tuamail@esempio.com" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                </div>
                <div class="form-group" style="text-align: left; margin-top: 15px;">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="••••••••" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                </div>
                <button type="submit" style="width: 100%; margin-top: 20px; padding: 12px; background-color: #3b5998; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Accedi / Registrati</button>
            </form>
        </div>
    </div>

    <!-- Schermata Principale dell'Applicazione -->
    <div id="app-screen" class="hidden">
        <header style="display: flex; justify-content: space-between; align-items: center; padding: 0 15px;">
            <h1 style="margin: 0;">Dashboard</h1>
            <button id="logout-btn" style="background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;">Esci</button>
        </header>

        <div class="container">
            <!-- Data Stipendio & Impostazioni -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label style="font-weight: bold; color: #3b5998; font-size: 14px; margin-bottom: 0;">Data Stipendio</label>
                    <button id="open-salary-modal" class="btn-icon" style="background: none; border: none; font-size: 20px; cursor: pointer;" title="Imposta Stipendio ed Extra">⚙️</button>
                </div>
                <input type="date" id="salary-date" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
            </div>

            <!-- Riepilogo Budget (Con i numeri grandi sopra le etichette) -->
            <div class="card">
                <h3 style="margin-top: 0; color: #3b5998; font-size: 16px; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 6px;">Riepilogo Budget</h3>
                <div class="metric-grid" style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <div class="metric-box-stack" style="flex: 1; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e9ecef; text-align: center;">
                        <strong id="days-left" style="font-size: 20px; display: block; color: #333;">0</strong>
                        <span style="font-size: 11px; color: #666; display: block; margin-top: 2px;">Giorni Mancanti</span>
                    </div>
                    <div class="metric-box-stack" style="flex: 1; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e9ecef; text-align: center;">
                        <strong id="spent-today" style="font-size: 20px; display: block; color: #333;">€ 0.00</strong>
                        <span style="font-size: 11px; color: #666; display: block; margin-top: 2px;">Speso Oggi</span>
                    </div>
                </div>
                <div class="metric-grid" style="display: flex; gap: 10px;">
                    <div class="metric-box-stack" style="flex: 1; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e9ecef; text-align: center;">
                        <strong id="salary-residue" style="font-size: 20px; display: block; color: #333;">€ 0.00</strong>
                        <span style="font-size: 11px; color: #666; display: block; margin-top: 2px;">Residuo</span>
                    </div>
                    <div class="metric-box-stack" style="flex: 1; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e9ecef; text-align: center;">
                        <strong id="daily-budget" style="font-size: 20px; display: block; color: #333;">€ 0.00</strong>
                        <span style="font-size: 11px; color: #666; display: block; margin-top: 2px;">Al Giorno</span>
                    </div>
                </div>
            </div>

            <!-- Modulo Inserimento Spesa -->
            <div class="card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 6px;">
                    <h3 id="form-expense-title" style="margin: 0; color: #3b5998; font-size: 16px;">Aggiungi Nuova Spesa</h3>
                    <button id="cancel-edit-btn" class="hidden" style="background: #6c757d; color: white; border: none; padding: 3px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;">Annulla</button>
                </div>
                
                <form id="expense-form">
                    <input type="hidden" id="edit-expense-id">
                    
                    <div class="form-group" style="margin-bottom: 12px;">
                        <label style="font-size: 14px; font-weight: bold; color: #3b5998;">Importo (€)</label>
                        <input type="number" step="0.01" id="expense-amount" required placeholder="0.00" style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                    </div>

                    <div class="form-group" style="margin-bottom: 12px;">
                        <label style="font-size: 14px; font-weight: bold; color: #3b5998;">Data</label>
                        <input type="date" id="expense-date" required style="width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                    </div>

                    <div class="form-group" style="margin-bottom: 15px; position: relative;">
                        <label style="font-size: 14px; font-weight: bold; color: #3b5998;">Categoria</label>
                        <div style="display: flex; gap: 5px;">
                            <input type="text" id="expense-category" autocomplete="off" required placeholder="Scrivi o seleziona..." style="flex: 1; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
                            <button type="button" id="delete-category-btn" style="background: #dc3545; color: white; border: none; padding: 0 12px; border-radius: 6px; cursor: pointer; font-size: 16px;" title="Elimina categoria selezionata">×</button>
                        </div>
                        <div id="category-dropdown" class="hidden" style="position: absolute; top: 100%; left: 0; right: 0; background: white; border: 1px solid #ccc; border-top: none; border-radius: 0 0 6px 6px; max-height: 150px; overflow-y: auto; z-index: 1000; box-shadow: 0 4px 6px rgba(0,0,0,0.1);"></div>
                    </div>

                    <button type="submit" style="width: 100%; padding: 12px; background-color: #3b5998; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Salva Spesa</button>
                </form>
            </div>

            <!-- Lista Spese di Oggi -->
            <div class="card">
                <h3 style="margin-top: 0; color: #3b5998; font-size: 16px; border-bottom: 1px solid rgba(0,0,0,0.08); padding-bottom: 6px;">Spese di oggi</h3>
                <div id="recent-expenses-list"></div>
            </div>

            <!-- Firma personalizzata: 15px, blu #0000ff, grassetto e inclinata -->
            <div class="watermark-signature">Created by STECCA</div>
        </div>

        <!-- Barra di Navigazione Fissa -->
        <nav class="nav-bar" style="position: fixed; bottom: 0; left: 0; right: 0; height: 75px; background: white; display: flex; border-top: 1px solid #ddd; box-shadow: -2px 5px rgba(0,0,0,0.05); z-index: 1000;">
            <a href="index.html" class="nav-item active" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #3b5998; font-size: 13px; font-weight: 600;">
                <span style="font-size: 24px; margin-bottom: 2px;">🏠</span> Dashboard
            </a>
            <a href="storico/storico.html" class="nav-item" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-decoration: none; color: #666; font-size: 13px; font-weight: 600;">
                <span style="font-size: 24px; margin-bottom: 2px;">📊</span> Storico
            </a>
        </nav>
    </div>

    <!-- Modale per Configurazione Stipendio ed Extra -->
    <div id="salary-modal" class="hidden" style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; z-index: 2000;">
        <div class="card" style="width: 90%; max-width: 400px; background: white; margin: 0;">
            <h3 style="margin-top: 0; color: #3b5998;">Imposta Stipendio ed Extra</h3>
            <div class="form-group" style="margin-bottom: 12px;">
                <label style="font-size: 13px; font-weight: bold; color: #3b5998;">Stipendio Base (€)</label>
                <input type="text" id="modal-salary-base" placeholder="Es. 1500" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div class="form-group" style="margin-bottom: 15px;">
                <label style="font-size: 13px; font-weight: bold; color: #3b5998;">Extra (puoi scrivere una somma es. 100 + 50)</label>
                <input type="text" id="modal-salary-extra" placeholder="Es. 0" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px;">
            </div>
            <div style="display: flex; gap: 10px;">
                <button id="save-salary-modal-btn" style="flex: 1; padding: 10px; background: #28a745; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Salva</button>
                <button id="close-salary-modal" style="flex: 1; padding: 10px; background: #6c757d; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">Chiudi</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/it.js"></script>
    <script type="module" src="app.js"></script>
</body>
</html>
