<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Spese</title>
    <link rel="stylesheet" href="style.css">
    <!-- Flatpickr CSS per calendario intervallo date unico -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

    <header>
        <h1>Storico & Filtri</h1>
    </header>

    <div class="container">
        <!-- Filtri del Periodo -->
        <div class="card card-highlight">
            <h3>Seleziona Periodo</h3>
            <div class="form-group">
                <label>Tipo di Filtro</label>
                <select id="filter-type">
                    <option value="day">Giorno</option>
                    <option value="week">Settimana</option>
                    <option value="month" selected>Mese</option>
                    <option value="year">Anno</option>
                    <option value="custom">Personalizzato</option>
                </select>
            </div>

            <!-- Selezione Giorno Singolo -->
            <div id="selector-day-container" class="form-group hidden">
                <label>Seleziona Giorno</label>
                <input type="date" id="select-day">
            </div>

            <!-- Selezione Mese -->
            <div id="selector-month-container" class="form-group">
                <label>Seleziona Mese</label>
                <input type="month" id="select-month">
            </div>

            <!-- Selezione Settimana -->
            <div id="selector-week-container" class="form-group hidden">
                <label>Seleziona Settimana</label>
                <input type="week" id="select-week">
            </div>

            <!-- Selezione Anno -->
            <div id="selector-year-container" class="form-group hidden">
                <label>Seleziona Anno</label>
                <select id="select-year"></select>
            </div>

            <!-- Selezione periodo personalizzato con calendario unico Inizio/Fine -->
            <div id="custom-date-container" class="form-group hidden">
                <label>Seleziona Intervallo Date (Inizio -> Fine)</label>
                <input type="text" id="date-range-picker" placeholder="Scegli data inizio e data fine">
            </div>

            <button id="apply-filter-btn" class="btn" style="margin-top:6px;">Applica Filtro</button>
        </div>

        <!-- Risultati Totali -->
        <div class="card">
            <h3>Risultati Periodo</h3>
            <div class="metric-box" style="margin-bottom: 12px;">
                <span>Totale Speso nel Periodo</span>
                <strong id="filter-total" style="font-size: 22px;">€ 0.00</strong>
            </div>

            <h4>Totali per Categoria</h4>
            <div id="category-totals-list" style="margin-top: 8px;"></div>
        </div>

        <!-- Elenco Spese Filtrate -->
        <div class="card">
            <h3>Dettaglio Spese</h3>
            <div id="filtered-expenses-list"></div>
        </div>
    </div>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
        <a href="index.html" class="nav-item">
            <span style="font-size: 18px;">🏠</span> Dashboard
        </a>
        <a href="storico.html" class="nav-item active">
            <span style="font-size: 18px;">📊</span> Storico e Filtri
        </a>
    </nav>

    <!-- Flatpickr JS -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/it.js"></script>

    <script type="module">
        import { auth, db, onAuthStateChanged, collection, getDocs } from "./firebase-config.js";

        let expenses = [];
        let rangePickerInstance = null;
        let selectedCustomFrom = null;
        let selectedCustomTo = null;

        // Inizializzazione date correnti
        const now = new Date();
        const curYear = now.getFullYear();
        const curMonth = String(now.getMonth() + 1).padStart(2, '0');
        const curDay = String(now.getDate()).padStart(2, '0');

        document.getElementById('select-day').value = `${curYear}-${curMonth}-${curDay}`;
        document.getElementById('select-month').value = `${curYear}-${curMonth}`;
        document.getElementById('select-week').value = `${curYear}-W01`;

        // Inizializzazione Calendario Unico Range Inizio/Fine
        rangePickerInstance = flatpickr("#date-range-picker", {
            mode: "range",
            locale: "it",
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",
            onChange: function(selectedDates) {
                if (selectedDates.length === 2) {
                    selectedCustomFrom = selectedDates[0];
                    selectedCustomTo = selectedDates[1];
                }
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const q = collection(db, "spese");
                const querySnapshot = await getDocs(q);
                expenses = [];
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    expenses.push({ 
                        id: docSnap.id, 
                        amount: parseFloat(data.importo || data.amount || 0),
                        date: data.data || data.date,
                        category: data.categoria || data.category 
                    });
                });
                populateYearsDropdown();
                applyFilter();
            } else {
                window.location.href = "index.html";
            }
        });

        function populateYearsDropdown() {
            const yearsSet = new Set();
            expenses.forEach(e => {
                if (e.date) {
                    const y = new Date(e.date).getFullYear();
                    if (!isNaN(y)) yearsSet.add(y);
                }
            });
            yearsSet.add(curYear);

            const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);
            const yearSelect = document.getElementById('select-year');
            yearSelect.innerHTML = '';
            sortedYears.forEach(y => {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            });
        }

        document.getElementById('filter-type').addEventListener('change', (e) => {
            const val = e.target.value;
            document.getElementById('selector-day-container').classList.add('hidden');
            document.getElementById('selector-month-container').classList.add('hidden');
            document.getElementById('selector-week-container').classList.add('hidden');
            document.getElementById('selector-year-container').classList.add('hidden');
            document.getElementById('custom-date-container').classList.add('hidden');

            if (val === 'day') {
                document.getElementById('selector-day-container').classList.remove('hidden');
            } else if (val === 'month') {
                document.getElementById('selector-month-container').classList.remove('hidden');
            } else if (val === 'week') {
                document.getElementById('selector-week-container').classList.remove('hidden');
            } else if (val === 'year') {
                document.getElementById('selector-year-container').classList.remove('hidden');
            } else if (val === 'custom') {
                document.getElementById('custom-date-container').classList.remove('hidden');
            }
        });

        document.getElementById('apply-filter-btn').addEventListener('click', applyFilter);

        function applyFilter() {
            const type = document.getElementById('filter-type').value;
            let from, to;

            if (type === 'day') {
                const dayVal = document.getElementById('select-day').value;
                if (!dayVal) return alert("Seleziona un giorno!");
                from = new Date(dayVal);
                from.setHours(0,0,0,0);
                to = new Date(dayVal);
                to.setHours(23,59,59,999);
            }
            else if (type === 'month') {
                const monthVal = document.getElementById('select-month').value;
                if (!monthVal) return alert("Seleziona un mese!");
                const [y, m] = monthVal.split('-');
                from = new Date(parseInt(y), parseInt(m) - 1, 1);
                to = new Date(parseInt(y), parseInt(m), 0, 23, 59, 59);
            } 
            else if (type === 'week') {
                const weekVal = document.getElementById('select-week').value;
                if (!weekVal) return alert("Seleziona una settimana!");
                
                const [yearStr, weekStr] = weekVal.split('-W');
                const yearNum = parseInt(yearStr);
                const weekNum = parseInt(weekStr);
                
                const simple = new Date(yearNum, 0, 1 + (weekNum - 1) * 7);
                const dow = simple.getDay();
                const ISOweekStart = simple;
                if (dow <= 4) {
                    ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
                } else {
                    ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
                }
                from = new Date(ISOweekStart);
                from.setHours(0,0,0,0);
                
                to = new Date(from);
                to.setDate(from.getDate() + 6);
                to.setHours(23,59,59,999);
            } 
            else if (type === 'year') {
                const yearNum = parseInt(document.getElementById('select-year').value);
                if (!yearNum) return alert("Seleziona un anno!");
                from = new Date(yearNum, 0, 1);
                to = new Date(yearNum, 11, 31, 23, 59, 59);
            } 
            else if (type === 'custom') {
                if (!selectedCustomFrom || !selectedCustomTo) {
                    return alert("Seleziona sia la data di inizio che quella di fine nel calendario!");
                }
                from = new Date(selectedCustomFrom);
                from.setHours(0,0,0,0);
                to = new Date(selectedCustomTo);
                to.setHours(23,59,59,999);
            }

            const filtered = expenses.filter(e => {
                const d = new Date(e.date);
                return d >= from && d <= to;
            });

            renderResults(filtered);
        }

        function renderResults(list) {
            const total = list.reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('filter-total').innerText = `€ ${total.toFixed(2)}`;

            const catTotals = {};
            list.forEach(e => {
                const cat = e.category || "Altro";
                catTotals[cat] = (catTotals[cat] || 0) + e.amount;
            });

            const catContainer = document.getElementById('category-totals-list');
            catContainer.innerHTML = '';
            
            if (Object.keys(catTotals).length === 0) {
                catContainer.innerHTML = '<div style="font-size: 12px; color: #888; padding: 6px;">Nessuna spesa in questo periodo.</div>';
            } else {
                for (const [cat, sum] of Object.entries(catTotals)) {
                    catContainer.innerHTML += `
                        <div class="expense-item">
                            <span class="item-title">${cat}</span>
                            <strong>€ ${sum.toFixed(2)}</strong>
                        </div>
                    `;
                }
            }

            const listContainer = document.getElementById('filtered-expenses-list');
            listContainer.innerHTML = '';

            if (list.length === 0) {
                listContainer.innerHTML = '<div style="font-size: 12px; color: #888; text-align: center; padding: 10px;">Nessun dettaglio spesa trovato.</div>';
                return;
            }

            list.sort((a,b) => new Date(b.date) - new Date(a.date)).forEach(exp => {
                listContainer.innerHTML += `
                    <div class="expense-item">
                        <div class="item-info">
                            <span class="item-title">${exp.category || "Altro"}</span>
                            <span class="item-sub">${exp.date}</span>
                        </div>
                        <strong>€ ${parseFloat(exp.amount).toFixed(2)}</strong>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
