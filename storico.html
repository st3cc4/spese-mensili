<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Spese</title>
    <link rel="stylesheet" href="style.css">
    <!-- Flatpickr CSS per calendario intervallo date unico -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <style>
        .filter-group-horizontal {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 10px;
        }
        
        /* Titoli delle card più grandi e ben visibili (Cerchiati in rosso) */
        .card h3 {
            font-size: 16px !important;
            color: #3b5998 !important;
            font-weight: bold !important;
            margin-bottom: 12px !important;
            border-bottom: 1px solid rgba(0,0,0,0.08);
            padding-bottom: 6px;
        }

        /* Etichette dei filtri e moduli standard */
        .filter-group-horizontal label {
            font-size: 14px !important;
            color: #3b5998 !important;
            font-weight: bold !important;
            margin-bottom: 0;
        }
        .filter-group-horizontal select, 
        .filter-group-horizontal input {
            flex: 1;
        }
        
        .metric-box-stack {
            flex: 1;
            background-color: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            padding: 10px 8px;
            text-align: center;
        }
        .metric-box-stack span.metric-title {
            display: block;
            font-size: 11px;
            color: #495057;
            text-transform: capitalize;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .metric-box-stack .amount-line {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 3px;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 75px !important;
            background: white;
            display: flex;
            border-top: 1px solid #ddd;
            box-shadow: -2px 5px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #666;
            font-size: 13px !important;
            font-weight: 600;
        }
        .nav-item span {
            font-size: 24px !important;
            margin-bottom: 2px;
        }
        body {
            padding-bottom: 90px !important;
        }

        #search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            border-top: none;
            border-radius: 0 0 6px 6px;
            max-height: 160px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .search-suggestion-item {
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid #f1f3f5;
        }
        .search-suggestion-item:hover {
            background-color: #f8f9fa;
            color: #3b5998;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header>
        <h1>Storico</h1>
    </header>

    <div class="container">
        <!-- Cerca Spesa -->
        <div class="card">
            <h3>Cerca spesa</h3>
            <div class="form-group filter-group-horizontal" style="margin-bottom: 0; position: relative;">
                <label>Filtra testo</label>
                <div style="flex: 1; position: relative;">
                    <input type="text" id="search-input" autocomplete="off" placeholder="Es. Benzina o 11.00" style="width: 100%; padding: 8px 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;">
                    <div id="search-dropdown" class="hidden"></div>
                </div>
            </div>
        </div>

        <!-- Seleziona Periodo -->
        <div class="card">
            <h3>Seleziona periodo</h3>
            
            <div style="display: flex; gap: 15px; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(0,0,0,0.08); align-items: center; flex-wrap: wrap;">
                <label style="font-size: 14px; color: #3b5998; font-weight: bold; margin-bottom: 0;">Account:</label>
                <label style="font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="chk-user1" style="width: auto; transform: scale(1.1);"> <span id="label-user1">Paolo</span>
                </label>
                <label style="font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                    <input type="checkbox" id="chk-user2" style="width: auto; transform: scale(1.1);"> <span id="label-user2">Elena</span>
                </label>
            </div>

            <div class="filter-group-horizontal">
                <label>Tipo di filtro</label>
                <select id="filter-type">
                    <option value="day" selected>Giorno</option>
                    <option value="week">Settimana</option>
                    <option value="month">Mese</option>
                    <option value="year">Anno</option>
                    <option value="custom">Personalizzato</option>
                </select>
            </div>

            <div id="selector-day-container" class="filter-group-horizontal">
                <label>Giorno</label>
                <input type="date" id="select-day">
            </div>

            <div id="selector-month-container" class="filter-group-horizontal hidden">
                <label>Mese</label>
                <input type="month" id="select-month">
            </div>

            <div id="selector-week-container" class="filter-group-horizontal hidden">
                <label>Settimana</label>
                <input type="week" id="select-week">
            </div>

            <div id="selector-year-container" class="filter-group-horizontal hidden">
                <label>Anno</label>
                <select id="select-year"></select>
            </div>

            <div id="custom-date-container" class="filter-group-horizontal hidden">
                <label>Intervallo</label>
                <input type="text" id="date-range-picker" placeholder="Inizio -> Fine">
            </div>
        </div>

        <!-- Risultati Periodo & Bilancio -->
        <div class="card">
            <h3>Risultati periodo</h3>
            
            <div class="metric-grid" style="margin-bottom: 8px;">
                <div class="metric-box-stack">
                    <span class="metric-title">Totale entrate</span>
                    <div class="amount-line">
                        <span class="income-amount">€</span>
                        <span id="filter-income-val" class="income-amount">0.00</span>
                    </div>
                </div>
                <div class="metric-box-stack">
                    <span class="metric-title">Totale speso</span>
                    <div class="amount-line">
                        <span class="expense-amount">€</span>
                        <span id="filter-total-val" class="expense-amount">0.00</span>
                    </div>
                </div>
            </div>

            <!-- Bilancio (sottrae le spese totali annuali dalle entrate totali annuali) -->
            <div class="metric-box" style="margin-bottom: 14px; background-color: #e9ecef;">
                <span>Bilancio</span>
                <strong id="filter-balance" style="font-size: 20px;">€ 0.00</strong>
            </div>

            <h3>Totali per categoria</h3>
            <div id="category-totals-list" style="margin-top: 8px;"></div>
        </div>

        <!-- Dettaglio Spese -->
        <div class="card">
            <h3>Dettaglio spese</h3>
            <div id="filtered-expenses-list"></div>
        </div>

        <div class="watermark-signature">Created by STECCA</div>
    </div>

    <nav class="nav-bar">
        <a href="index.html" class="nav-item">
            <span>🏠</span> Dashboard
        </a>
        <a href="storico.html" class="nav-item active">
            <span>📊</span> Storico
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/it.js"></script>

    <script type="module">
        import { auth, db, onAuthStateChanged, collection, getDocs, deleteDoc, doc, getDoc } from "./firebase-config.js";

        let currentUser = null;
        let expenses = [];
        let rangePickerInstance = null;
        let selectedCustomFrom = null;
        let selectedCustomTo = null;

        const monthlySalaries2026 = {
            "2026-01": 1733.19,
            "2026-02": 1895.23,
            "2026-03": 1163.78,
            "2026-04": 1327.81,
            "2026-05": 1562.19,
            "2026-06": 1149.45,
            "2026-07": 2864.79,
            "2026-08": 1369.93,
            "2026-09": 1512.63,
            "2026-10": 1415.57,
            "2026-11": 0.00,
            "2026-12": 0.00
        };

        function getISOWeekString(date) {
            const target = new Date(date.valueOf());
            const dayNr = (date.getDay() + 6) % 7;
            target.setDate(target.getDate() - dayNr + 3);
            const firstThursday = target.valueOf();
            target.setMonth(0, 1);
            if (target.getDay() !== 4) {
                target.setMonth(0, 1 + ((4 - target.getDay() + 7) % 7));
            }
            const weekNumber = 1 + Math.round((firstThursday - target.valueOf()) / 604800000);
            const year = target.getFullYear();
            const weekStr = String(weekNumber).padStart(2, '0');
            return `${year}-W${weekStr}`;
        }

        const now = new Date();
        const curYear = now.getFullYear();
        const curMonth = String(now.getMonth() + 1).padStart(2, '0');
        const curDay = String(now.getDate()).padStart(2, '0');

        document.getElementById('select-day').value = `${curYear}-${curMonth}-${curDay}`;
        document.getElementById('select-month').value = `${curYear}-${curMonth}`;
        document.getElementById('select-week').value = getISOWeekString(now);

        rangePickerInstance = flatpickr("#date-range-picker", {
            mode: "range",
            locale: "it",
            dateFormat: "Y-m-d",
            altInput: true,
            altFormat: "d/m/Y",
            onChange: function(selectedDates) {
                if (selectedDates.length === 2) {
                    selectedCustomFrom = selectedDates[0];
                    selectedCustomTo = selectedDates[1];
                    applyFilter();
                }
            }
        });

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                
                const email = (user.email || "").toLowerCase();
                const isUserLoggedElena = email.includes("ele");
                
                document.getElementById('label-user1').innerText = isUserLoggedElena ? "Elena" : "Paolo";
                document.getElementById('label-user2').innerText = isUserLoggedElena ? "Paolo" : "Elena";

                document.getElementById('chk-user1').checked = true;
                document.getElementById('chk-user2').checked = false;

                await loadConfigAndExpenses();
            } else {
                window.location.href = "index.html";
            }
        });

        async function loadConfigAndExpenses() {
            const q = collection(db, "spese");
            const querySnapshot = await getDocs(q);
            expenses = [];
            querySnapshot.forEach((docSnap) => {
                const data = docSnap.data();
                expenses.push({ 
                    id: docSnap.id, 
                    amount: parseFloat((data.importo || data.amount || 0).toString().replace(',', '.')) || 0,
                    date: data.data || data.date,
                    category: data.categoria || data.category,
                    userId: data.userId || "" 
                });
            });

            populateYearsDropdown();
            setupSearchAutocomplete();
            applyFilter();
        }

        function populateYearsDropdown() {
            const yearsSet = new Set();
            expenses.forEach(e => {
                if (e.date) {
                    const y = new Date(e.date).getFullYear();
                    if (!isNaN(y)) yearsSet.add(y);
                }
            });
            yearsSet.add(curYear);

            const sortedYears = Array.from(yearsSet).sort((a, b) => b - a);
            const yearSelect = document.getElementById('select-year');
            yearSelect.innerHTML = '';
            sortedYears.forEach(y => {
                yearSelect.innerHTML += `<option value="${y}">${y}</option>`;
            });
        }

        function setupSearchAutocomplete() {
            const searchInput = document.getElementById('search-input');
            const searchDropdown = document.getElementById('search-dropdown');
            if (!searchInput || !searchDropdown) return;

            const suggestionsSet = new Set();
            expenses.forEach(e => {
                if (e.category) suggestionsSet.add(e.category);
            });
            const suggestions = Array.from(suggestionsSet).sort();

            function renderSearchDropdown(list) {
                searchDropdown.innerHTML = '';
                if (list.length === 0) {
                    searchDropdown.classList.add('hidden');
                    return;
                }
                list.forEach(itemText => {
                    const item = document.createElement('div');
                    item.className = 'search-suggestion-item';
                    item.innerText = itemText;
                    item.onclick = () => {
                        searchInput.value = itemText;
                        searchDropdown.classList.add('hidden');
                        applyFilter();
                    };
                    searchDropdown.appendChild(item);
                });
                searchDropdown.classList.remove('hidden');
            }

            searchInput.onfocus = () => {
                renderSearchDropdown(suggestions);
            };

            searchInput.oninput = (e) => {
                const val = e.target.value.toLowerCase();
                const filtered = suggestions.filter(s => s.toLowerCase().includes(val));
                renderSearchDropdown(filtered);
                applyFilter();
            };

            document.onclick = (e) => {
                if (!searchInput.contains(e.target) && !searchDropdown.contains(e.target)) {
                    searchDropdown.classList.add('hidden');
                }
            };
        }

        document.getElementById('filter-type').addEventListener('change', (e) => {
            const val = e.target.value;
            document.getElementById('selector-day-container').classList.add('hidden');
            document.getElementById('selector-month-container').classList.add('hidden');
            document.getElementById('selector-week-container').classList.add('hidden');
            document.getElementById('selector-year-container').classList.add('hidden');
            document.getElementById('custom-date-container').classList.add('hidden');

            if (val === 'day') {
                document.getElementById('selector-day-container').classList.remove('hidden');
            } else if (val === 'month') {
                document.getElementById('selector-month-container').classList.remove('hidden');
            } else if (val === 'week') {
                document.getElementById('selector-week-container').classList.remove('hidden');
            } else if (val === 'year') {
                document.getElementById('selector-year-container').classList.remove('hidden');
            } else if (val === 'custom') {
                document.getElementById('custom-date-container').classList.remove('hidden');
            }
            applyFilter();
        });

        document.getElementById('select-day').addEventListener('change', applyFilter);
        document.getElementById('select-month').addEventListener('change', applyFilter);
        document.getElementById('select-week').addEventListener('input', applyFilter);
        document.getElementById('select-year').addEventListener('change', applyFilter);
        document.getElementById('chk-user1').addEventListener('change', applyFilter);
        document.getElementById('chk-user2').addEventListener('change', applyFilter);

        function formatDateToEu(dateStr) {
            if (!dateStr) return "";
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateStr;
        }

        function applyFilter() {
            const chkUser1 = document.getElementById('chk-user1').checked;
            const chkUser2 = document.getElementById('chk-user2').checked;
            const type = document.getElementById('filter-type').value;
            const searchText = document.getElementById('search-input').value.toLowerCase().trim();
            let from, to;

            const email = (currentUser.email || "").toLowerCase();
            const isUserLoggedElena = email.includes("ele");

            const visibleExpenses = expenses.filter(e => {
                const isUser1Expense = isUserLoggedElena 
                    ? (e.userId === currentUser.uid) 
                    : (e.userId === currentUser.uid || e.userId === "");
                
                const isUser2Expense = isUserLoggedElena 
                    ? (e.userId !== currentUser.uid || e.userId === "") 
                    : (e.userId !== currentUser.uid && e.userId !== "");

                if (chkUser1 && chkUser2) return true; 
                if (chkUser1 && !chkUser2) return isUser1Expense; 
                if (!chkUser1 && chkUser2) return isUser2Expense; 
                return false;
            });

            if (type === 'day') {
                const dayVal = document.getElementById('select-day').value;
                if (!dayVal) return;
                from = new Date(dayVal);
                from.setHours(0,0,0,0);
                to = new Date(dayVal);
                to.setHours(23,59,59,999);
            }
            else if (type === 'month') {
                const monthVal = document.getElementById('select-month').value;
                if (!monthVal) return;
                const [y, m] = monthVal.split('-');
                from = new Date(parseInt(y), parseInt(m) - 1, 1);
                to = new Date(parseInt(y), parseInt(m), 0, 23, 59, 59);
            } 
            else if (type === 'week') {
                const weekVal = document.getElementById('select-week').value;
                if (!weekVal) return;
                
                const [yearStr, weekStr] = weekVal.split('-W');
                const yearNum = parseInt(yearStr);
                const weekNum = parseInt(weekStr);
                
                const simple = new Date(yearNum, 0, 1 + (weekNum - 1) * 7);
                const dow = simple.getDay();
                const ISOweekStart = simple;
                if (dow <= 4) {
                    ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
                } else {
                    ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
                }
                from = new Date(ISOweekStart);
                from.setHours(0,0,0,0);
                
                to = new Date(from);
                to.setDate(from.getDate() + 6);
                to.setHours(23,59,59,999);
            } 
            else if (type === 'year') {
                const yearNum = parseInt(document.getElementById('select-year').value);
                if (!yearNum) return;
                from = new Date(yearNum, 0, 1);
                to = new Date(yearNum, 11, 31, 23, 59, 59);
            } 
            else if (type === 'custom') {
                if (!selectedCustomFrom || !selectedCustomTo) return;
                from = new Date(selectedCustomFrom);
                from.setHours(0,0,0,0);
                to = new Date(selectedCustomTo);
                to.setHours(23,59,59,999);
            }

            const filtered = visibleExpenses.filter(e => {
                const d = new Date(e.date);
                const matchDate = (d >= from && d <= to);
                
                if (!matchDate) return false;

                if (searchText) {
                    const catMatch = (e.category || "").toLowerCase().includes(searchText);
                    const amountMatch = e.amount.toFixed(2).includes(searchText) || e.amount.toString().includes(searchText);
                    return catMatch || amountMatch;
                }

                return true;
            });

            renderResults(filtered, from, to, type, chkUser1, chkUser2, visibleExpenses);
        }

        function renderResults(list, from, to, type, chkUser1, chkUser2, visibleExpenses) {
            const totalSpent = list.reduce((sum, e) => sum + e.amount, 0);
            document.getElementById('filter-total-val').innerText = totalSpent.toFixed(2);

            let multiplier = 0;
            if (chkUser1) multiplier++;
            if (chkUser2) multiplier++;

            let totalIncomeYearToDate = 0;
            const nowTime = new Date();
            nowTime.setHours(23,59,59,999);

            Object.entries(monthlySalaries2026).forEach(([mKey, amount]) => {
                const [yStr, mStr] = mKey.split('-');
                const monthDate = new Date(parseInt(yStr), parseInt(mStr) - 1, 1);
                if (monthDate <= nowTime) {
                    totalIncomeYearToDate += (amount || 0);
                }
            });

            let totalIncome = totalIncomeYearToDate * multiplier;
            document.getElementById('filter-income-val').innerText = totalIncome.toFixed(2);

            // CALCOLO BILANCIO ANNUALE: Entrate totali anno - Spese totali anno (degli account selezionati)
            const totalSpentYearAll = visibleExpenses.reduce((sum, e) => sum + e.amount, 0);
            const netBalance = totalIncome - totalSpentYearAll;

            const balanceElement = document.getElementById('filter-balance');
            balanceElement.innerText = `€ ${netBalance.toFixed(2)}`;
            balanceElement.style.color = netBalance >= 0 ? '#28a745' : '#dc3545';

            const catTotals = {};
            list.forEach(e => {
                const cat = e.category || "Altro";
                catTotals[cat] = (catTotals[cat] || 0) + e.amount;
            });

            const catContainer = document.getElementById('category-totals-list');
            catContainer.innerHTML = '';
            
            if (Object.keys(catTotals).length === 0) {
                catContainer.innerHTML = '<div style="font-size: 12px; color: #888; padding: 6px;">Nessuna spesa trovata.</div>';
            } else {
                const sortedCategories = Object.keys(catTotals).sort((a, b) => a.localeCompare(b, 'it', { sensitivity: 'base' }));
                
                sortedCategories.forEach(cat => {
                    const sum = catTotals[cat];
                    catContainer.innerHTML += `
                        <div class="expense-item">
                            <span class="item-title">${cat}</span>
                            <strong>€ ${sum.toFixed(2)}</strong>
                        </div>
                    `;
                });
            }

            const listContainer = document.getElementById('filtered-expenses-list');
            listContainer.innerHTML = '';

            if (list.length === 0) {
                listContainer.innerHTML = '<div style="font-size: 12px; color: #888; text-align: center; padding: 10px;">Nessun dettaglio spesa trovato.</div>';
                return;
            }

            list.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(exp => {
                const dateEu = formatDateToEu(exp.date);
                listContainer.innerHTML += `
                    <div class="expense-item">
                        <div class="item-info">
                            <span class="item-title">${exp.category || "Altro"}</span>
                            <span class="item-sub">${dateEu}</span>
                        </div>
                        <div class="item-actions">
                            <strong style="margin-right:8px;">€ ${parseFloat(exp.amount).toFixed(2)}</strong>
                            <button class="btn-edit" onclick="editExpenseRedirect('${exp.id}', '${exp.amount}', '${exp.date}', '${exp.category}')">✏️</button>
                            <button class="btn-danger" onclick="deleteExpenseFromHistory('${exp.id}')">🗑️</button>
                        </div>
                    </div>
                `;
            });
        }

        window.editExpenseRedirect = (id, amount, date, category) => {
            localStorage.setItem('edit_id', id);
            localStorage.setItem('edit_amount', amount);
            localStorage.setItem('edit_date', date);
            localStorage.setItem('edit_category', category);
            window.location.href = "index.html";
        };

        window.deleteExpenseFromHistory = async (id) => {
            if (confirm("Vuoi cancellare questa spesa?")) {
                try {
                    await deleteDoc(doc(db, "spese", id));
                    await loadConfigAndExpenses();
                } catch (err) {
                    alert("Errore durante l'eliminazione: " + err.message);
                }
            }
        };
    </script>
</body>
</html>
