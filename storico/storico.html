<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico Spese</title>
    <link rel="stylesheet" href="stile-storico.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>
<body>

    <header>
        <h1>Storico</h1>
    </header>

    <div class="container">
        <!-- Cerca Spesa -->
        <div class="card">
            <h3>Cerca spesa</h3>
            <div class="filter-group-horizontal" style="margin-bottom: 0; position: relative;">
                <label>Filtra testo</label>
                <div style="flex: 1; position: relative;">
                    <input type="text" id="search-input" autocomplete="off" placeholder="Es. Benzina o 11.00" class="bold-input">
                    <div id="search-dropdown" class="hidden"></div>
                </div>
            </div>
        </div>

        <!-- Seleziona Periodo -->
        <div class="card">
            <h3>Seleziona periodo</h3>
            
            <div class="account-filter-container">
                <label style="font-size: 14px; color: #3b5998; font-weight: bold; margin-bottom: 0;">Account:</label>
                <label class="checkbox-label">
                    <input type="checkbox" id="chk-user1"> Paolo
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="chk-user2"> Elena
                </label>
            </div>

            <div class="filter-group-horizontal">
                <label>Tipo di filtro</label>
                <select id="filter-type" class="bold-input">
                    <option value="day">Giorno</option>
                    <option value="week">Settimana</option>
                    <option value="month" selected>Mese</option>
                    <option value="year">Anno</option>
                    <option value="custom">Personalizzato</option>
                </select>
            </div>

            <div id="selector-day-container" class="filter-group-horizontal hidden">
                <label>Giorno</label>
                <input type="date" id="select-day" class="bold-input">
            </div>

            <div id="selector-month-container" class="filter-group-horizontal">
                <label>Mese</label>
                <input type="month" id="select-month" class="bold-input">
            </div>

            <div id="selector-week-container" class="filter-group-horizontal hidden">
                <label>Settimana</label>
                <input type="week" id="select-week" class="bold-input">
            </div>

            <div id="selector-year-container" class="filter-group-horizontal hidden">
                <label>Anno</label>
                <select id="select-year" class="bold-input"></select>
            </div>

            <div id="custom-date-container" class="filter-group-horizontal hidden">
                <label>Intervallo</label>
                <input type="text" id="date-range-picker" placeholder="Inizio -> Fine" class="bold-input">
            </div>
        </div>

        <!-- Risultati Periodo & Bilancio -->
        <div class="card">
            <h3>Risultati periodo</h3>
            
            <div class="metric-grid" style="margin-bottom: 10px;">
                <div class="metric-box-row">
                    <span class="metric-label">Entrate</span>
                    <strong id="filter-income-val" class="income-amount">€ 0.00</strong>
                </div>
                <div class="metric-box-row">
                    <span class="metric-label">Speso</span>
                    <strong id="filter-total-val" class="expense-amount">€ 0.00</strong>
                </div>
            </div>

            <!-- Bilancio -->
            <div class="metric-box-row" style="margin-bottom: 16px; background-color: #e9ecef; padding: 12px 10px;">
                <span class="metric-label" style="font-size: 14px;">Bilancio</span>
                <strong id="filter-balance" style="font-size: 20px; white-space: nowrap;">€ 0.00</strong>
            </div>

            <h3>Totali per categoria</h3>
            <div id="category-totals-list" style="margin-top: 8px;"></div>
        </div>

        <!-- Dettaglio Spese -->
        <div class="card">
            <h3>Dettaglio spese</h3>
            <div id="filtered-expenses-list"></div>
        </div>

        <!-- Firma personalizzata -->
        <div class="watermark-signature">Created by STECCA</div>
    </div>

    <!-- Barra di navigazione fissa -->
    <nav class="nav-bar">
        <a href="../index.html" class="nav-item">
            <span>🏠</span> Dashboard
        </a>
        <a href="storico.html" class="nav-item active">
            <span>📊</span> Storico
        </a>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/it.js"></script>
    <script type="module" src="storico.js"></script>
</body>
</html>
